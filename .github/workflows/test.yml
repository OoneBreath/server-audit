name: tests
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is the lowest supported version (RHEL 9 still ships it); setup-python no
          # longer has it for the newest Ubuntu image (ubuntu-latest = 26.04), so it runs on 24.04.
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib only, no dependencies)
        run: python3 -m unittest discover -s tests -v
      - name: Probe script syntax
        run: bash -n scripts/probe_external.sh
  lab:
    # builds the two lab containers (fake secrets), audits them, probes them from the runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: End-to-end on lab/ubuntu and lab/rhel
        env:
          SERVER_AUDIT_E2E: "1"
        run: python3 -m unittest tests.test_lab_e2e -v
  podman:
    # a real Podman engine: rootful containers (running and stopped), rootful and rootless quadlets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Podman end to end
        run: |
          podman --version
          sudo env SERVER_AUDIT_PODMAN_E2E=1 SUDO_USER="$USER" python3 -m unittest tests.test_podman_e2e -v
