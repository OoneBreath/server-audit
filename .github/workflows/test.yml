name: tests
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib only, no dependencies)
        run: python3 -m unittest discover -s tests -v
      - name: Probe script syntax
        run: bash -n scripts/probe_external.sh
  lab:
    # builds the two lab containers (fake secrets), audits them, probes them from the runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: End-to-end on lab/ubuntu and lab/rhel
        env:
          SERVER_AUDIT_E2E: "1"
        run: python3 -m unittest tests.test_lab_e2e -v
